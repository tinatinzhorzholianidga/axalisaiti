worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    client_max_body_size 26m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rid=$request_id rt=$request_time';
    access_log /var/log/nginx/access.log main;

    upstream web { server web:8000; keepalive 32; }

    server {
        listen 80;
        server_name _;

        # Static assets: served by nginx directly, long cache (hashed names).
        location /static/ {
            alias /srv/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            add_header Cross-Origin-Resource-Policy same-origin;
            try_files $uri =404;
        }

        # Private uploads are NEVER exposed here; Flask streams them with auth checks.
        location /uploads/ { return 404; }
        location ~ /\. { deny all; }

        location /auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_conn perip 20;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://web;
        }

        location / {
            limit_req zone=general burst=60 nodelay;
            limit_conn perip 50;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://web;
        }
    }
}
