{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-stack container" role="status" aria-live="polite">
  {% for category, message in messages %}
  <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible" role="alert">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="{{ _('Close') }}"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
