{# Official cube logo (Digital Governance Agency): navy mark in light mode, white mark in dark mode.
   Both files are real brand assets under app/static/img; CSS decides which one is visible. #}
<span class="brand-logo" role="img" aria-label="{{ site_name }}">
  <img class="logo-img logo-img--light" src="{{ url_for('static', filename='img/logo-light.png') }}" alt="" width="33" height="36" decoding="async">
  <img class="logo-img logo-img--dark" src="{{ url_for('static', filename='img/logo-dark.png') }}" alt="" width="36" height="36" decoding="async">
</span>
